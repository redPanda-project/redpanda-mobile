tags:
  e2e:
    # Must cover the slowest E2E suite (MS05 reverse garlic, ~2-6 min under
    # concurrent load): this tag timeout overrides the @Timeout annotations
    # in the test files.
    timeout: 10m
  lab:
    # Conversation lab (test/lab): opt-in via RP_LAB=1, one long test that
    # starts its own node network. The tag timeout overrides the @Timeout
    # annotation, like for e2e above.
    timeout: 30m
