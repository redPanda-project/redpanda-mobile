syntax = "proto3";

package im.redpanda.proto;

option java_package = "im.redpanda.proto";
option java_multiple_files = true;

message KademliaIdProto {
    bytes key_bytes = 1; // 20 bytes
}

message NodeIdProto {
    bytes public_key_bytes = 1; // 65 bytes
}

message PeerInfoProto {
    string ip = 1;
    int32 port = 2;
    NodeIdProto node_id = 3; // optional if not known
}

message SendPeerList {
    repeated PeerInfoProto peers = 1;
}

message Ping {
}

message Pong {
}

message RequestPeerList {
}

message KademliaGet {
    int32 job_id = 1;
    KademliaIdProto searched_id = 2;
}

message KademliaGetAnswer {
    int32 ack_id = 1;
    int64 timestamp = 2;
    bytes public_key = 3;
    bytes content = 4;
    bytes signature = 5;
}

message KademliaStore {
    int32 job_id = 1;
    int64 timestamp = 2;
    bytes public_key = 3;
    bytes content = 4;
    bytes signature = 5;
}

message JobAck {
    int32 job_id = 1;
}

message FlaschenpostPut {
    bytes content = 1;
    bytes oh_id = 2;    // 20 bytes — target OH mailbox KademliaId
}

// --- Outbound Handle (OH) Registration ---

enum Status {
    STATUS_UNSPECIFIED = 0;
    OK = 1;
    INVALID_SIGNATURE = 2;
    INVALID_TIMESTAMP = 3;
    REPLAY = 4;
    NOT_FOUND = 5;
    RATE_LIMIT = 6;
    QUOTA_EXCEEDED = 7;
    BAD_REQUEST = 8;
}

message RegisterOhRequest {
    bytes oh_id = 1;                  // 20 bytes (KademliaId)
    bytes oh_auth_public_key = 2;     // 65 bytes (brainpoolp256r1 uncompressed)
    int64 requested_expires_at = 3;   // millis since epoch
    int64 timestamp_ms = 4;
    bytes nonce = 5;                  // 16 bytes
    bytes signature = 6;              // DER-encoded ECDSA signature
}

message RegisterOhResponse {
    Status status = 1;
    int64 server_time_ms = 2;
    int64 expires_at_ms = 3;
}

// --- Fetch messages from OH mailbox ---

message FetchRequest {
    bytes oh_id = 1;
    uint32 limit = 2;
    uint64 cursor = 3;
    int64 timestamp_ms = 4;
    bytes nonce = 5;
    bytes signature = 6;
}

message MailItem {
    bytes message_id = 1;
    int64 received_at_ms = 2;
    bytes payload = 3;
}

message FetchResponse {
    Status status = 1;
    uint64 next_cursor = 2;
    repeated MailItem items = 3;
    int64 server_time_ms = 4;
}

// Unified envelope for future-proofing or batching, 
// though we currently use a 1-byte header for dispatch.
message PandaMessage {
    oneof content {
        Ping ping = 1;
        Pong pong = 2;
        RequestPeerList request_peer_list = 3;
        SendPeerList send_peer_list = 4;
        KademliaGet kademlia_get = 5;
        KademliaGetAnswer kademlia_get_answer = 6;
        KademliaStore kademlia_store = 7;
        JobAck job_ack = 8;
        FlaschenpostPut flaschenpost_put = 9;
    }
}

message GarlicMessage {
    int32 type = 1;             // GMType
    KademliaIdProto destination = 2;
    bytes iv = 3;
    bytes sender_public_key = 4; // Ephemeral public key
    bytes encrypted_payload = 5; // Encrypted nested messages
    bytes signature = 6;
}
