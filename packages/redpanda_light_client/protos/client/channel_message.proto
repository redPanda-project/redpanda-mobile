// Client-to-client wire schemas (TD098/T142) — owned by THIS repo.
//
// Unlike the vendored ../*.proto (copied from redpandaj by
// tool/sync_protos.sh, never edited here), the files under protos/client/
// describe payloads that only ever travel end-to-end encrypted between two
// light clients. The backend treats them as opaque bytes and deliberately
// does not model them (SK2), so they are maintained here and generated by
// tool/generate_protos.sh into lib/src/generated/client/.
//
// Wire compatibility with deployed clients is not negotiable: every field
// number, type and presence rule below mirrors what the hand-written codecs
// put on the wire. Do not renumber, retype or "clean up" fields.
//
// Not described here — the outer envelopes are fixed-offset binary frames,
// not protobuf, and keep their hand-written codecs:
//
//   v3 (MessageCryptoV3):  [0x03][nonce 12][AES-GCM(ChannelMessage) + tag 16]
//   v4 (MessageCryptoV4):  [0x04][ratchet_pub 32][PN 4 BE][N 4 BE][nonce 12]
//                          [AES-GCM(ChannelMessage) + tag 16]
//   v5 (GroupCryptoSession, group message):
//          outer [0x05][key_epoch 4 BE][nonce 12][ct + tag 16]
//          inner [member_id 32][N 4 BE][nonce 12][ct + tag 16][sig 64]
//   v6 (GroupCryptoSession.seal, sealed control):
//          [0x06][eph_pub 32][nonce 12][AES-GCM(signed rotation) + tag 16]
//          signed rotation = [control_len 4 BE][GroupControl][admin sig 64]
//
// The ciphertexts of v3/v4/v5 carry a serialized ChannelMessage; v6 carries a
// serialized GroupControl (group_control.proto) inside the signed wrapper.
syntax = "proto3";

package im.redpanda.client.v1;

// The inner plaintext of a channel message (MS03 message-format-v2).
// Field 4 has never been used.
message ChannelMessage {
  bytes message_id = 1;      // 16 random bytes, stable across retries
  int64 timestamp_ms = 2;    // sender clock, Unix ms
  string content = 3;
  bytes reply_path = 5;      // MS05: serialized ReverseGarlicBlock
  bytes ack_message_id = 6;  // MS06: Channel-ACK for this message id
  bytes group_handshake = 7; // MS08: serialized GroupHandshake (1:1 only)
  bytes group_control = 8;   // MS08: serialized GroupControl (groups only)
  bytes oh_update = 9;       // T21: UTF-8 OHDescriptor JSON (OH failover)
}
