name: Emulator Duo E2E

# PoC (TD053): run the emulator duo gate on a GitHub-hosted runner instead of
# the developer host. ubuntu-latest (public repo) = 4 vCPU / 16 GB RAM, and
# /dev/kvm is available on all 2+ vCPU Linux runners since 2024-04 — the udev
# step below is the documented way to open it up:
# https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
#
# T103: the PoC held up (run 32982989702, full s1-s4 green in 11m43s), so this
# is now the primary way to run the gate: nightly for a flake baseline, and on
# demand before a deploy or to gate a harness PR. Note when gating a branch:
# workflow_dispatch reads the workflow definition from the ref you dispatch, so
# the branch must already contain this file -- merge main into it first. That is
# how mobile#101 was gated (merge ae1364a, then run 33091988264).
# The local harness under tool/emu_duo_e2e/ stays the fallback for debugging
# with the emulators in front of you -- it is the same script either way.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'RP_SCENARIOS (comma list of s1,s2,s3,s4; s1 always runs)'
        required: false
        default: 's1,s2,s3,s4'
  schedule:
    # 02:17 UTC. Off the hour on purpose: GitHub queues the whole cron minute
    # across all of github.com, and :00 is the worst of them.
    - cron: '17 2 * * *'

permissions:
  contents: read

# A run takes ~12-25 min and boots two emulators. Overlapping runs on the same
# ref would compete for the same runner minutes without telling us anything new,
# so queue them instead -- and do NOT cancel in progress: a nightly that gets
# killed halfway by a manual dispatch would look like a flake in the baseline.
concurrency:
  group: emu-duo-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  duo-e2e:
    runs-on: ubuntu-latest
    # Local full runs are ~15-25 min after the APK build; the first CI run
    # also pays SDK image download + cold Gradle. Generous PoC ceiling.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # MODE=0666 is deliberate: this is the unlock documented by GitHub for
      # hosted runners (see changelog link above). The tighter alternative —
      # kvm group + membership for the runner user — does not apply to the
      # already-running job session without a re-login, and the runner VM is
      # ephemeral and single-user anyway.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The PoC question is "does this runner virtualize?" — fail loudly here,
      # not 20 minutes later inside the harness.
      - name: Verify KVM + resources
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo
          free -h
          df -h /
          nproc

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in lockstep with .github/workflows/flutter_ci.yml, which holds
          # the rationale for the exact pin. The gate must run on the same
          # toolchain as the build CI, or a green gate proves nothing about the
          # code the build CI checked.
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install emulator platform-tools "system-images;android-35;google_apis;x86_64"

      # TD122: sdkmanager has no revision pin for system images — it always
      # installs the latest one. Only the image is pinned; `emulator` and
      # `platform-tools` still float (their revisions are logged below). So pin by assertion: a new image revision fails
      # here, with a clear message, instead of silently changing the gate
      # environment under an unrelated code change. Fail, not warn: the gate is
      # read as "code X is green"; a warning in a green run is not read, and a
      # gate that flips because the image moved would then be blamed on the
      # code. Bumping is one deliberate edit (like the Flutter pin), ideally in
      # its own PR whose gate run shows the new image is fine.
      - name: Verify system image revision (pinned)
        env:
          EXPECTED_IMAGE_REVISION: '9'
        run: |
          PROPS="$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties"
          [ -r "$PROPS" ] || { echo "::error::$PROPS not found — sdkmanager installed the image elsewhere?"; exit 1; }
          for pkg in emulator platform-tools; do
            echo "$pkg revision (not pinned): $(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/$pkg/source.properties" 2>/dev/null)"
          done
          actual="$(sed -n 's/^Pkg.Revision=//p' "$PROPS" | tr -d '\r')"
          echo "system-images;android-35;google_apis;x86_64 revision: ${actual:-<none>} (pinned: $EXPECTED_IMAGE_REVISION)"
          if [ "$actual" != "$EXPECTED_IMAGE_REVISION" ]; then
            echo "::error::system image revision is '${actual:-<none>}', the gate pins '$EXPECTED_IMAGE_REVISION'. Google published a new image (sdkmanager cannot install old revisions). Bump EXPECTED_IMAGE_REVISION in .github/workflows/emu_duo_e2e.yml in its own PR and gate that PR (TD122)."
            exit 1
          fi

      # Unlike the build CI this is a hard requirement: the harness starts a
      # local node from this jar and dies without it.
      - name: Download RedPanda JAR (Backend)
        run: |
          mkdir -p references/redPandaj/target
          gh release download latest --repo redPanda-project/redpandaj --pattern 'redpanda.jar' --dir references/redPandaj/target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies + codegen (App)
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run emulator duo E2E
        env:
          RP_SCENARIOS: ${{ inputs.scenarios || 's1,s2,s3,s4' }}
          # TD058: the 16 GB runner has room, so give each guest 2 GB here to
          # cut low-memory-killer churn (lmkdKills in counters.json) and
          # wall-clock. Local runs keep run.sh's host-friendly 1024 default.
          RP_AVD_RAM_MB: '2048'
        # env -u XDG_CONFIG_HOME: the runner image sets XDG_CONFIG_HOME, which
        # makes avdmanager place AVDs in $XDG_CONFIG_HOME/.android/avd while
        # run.sh (and the emulator on a default dev box, where the variable is
        # unset) expects $HOME/.android/avd. Unsetting it restores the default
        # instead of teaching run.sh a second AVD-home resolution.
        run: env -u XDG_CONFIG_HOME tool/emu_duo_e2e/run.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: build/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
