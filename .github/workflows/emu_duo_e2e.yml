name: Emulator Duo E2E

# PoC (TD053): run the emulator duo gate on a GitHub-hosted runner instead of
# the developer host. ubuntu-latest (public repo) = 4 vCPU / 16 GB RAM, and
# /dev/kvm is available on all 2+ vCPU Linux runners since 2024-04 — the udev
# step below is the documented way to open it up:
# https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
#
# Manual trigger only while this is a PoC. If it proves stable, wire it up as
# a nightly + deploy gate.
on:
  # TEMPORARY (PoC test drive): trigger on pushes to this branch so the run
  # can start before the file exists on main. Remove before merge.
  push:
    branches: [ feat/emu-e2e-ci-poc ]
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'RP_SCENARIOS (comma list of s1,s2,s3,s4; s1 always runs)'
        required: false
        default: 's1,s2,s3,s4'

permissions:
  contents: read

jobs:
  duo-e2e:
    runs-on: ubuntu-latest
    # Local full runs are ~15-25 min after the APK build; the first CI run
    # also pays SDK image download + cold Gradle. Generous PoC ceiling.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The PoC question is "does this runner virtualize?" — fail loudly here,
      # not 20 minutes later inside the harness.
      - name: Verify KVM + resources
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo
          free -h
          df -h /
          nproc

      - name: Set up Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install emulator platform-tools "system-images;android-35;google_apis;x86_64"

      # Unlike the build CI this is a hard requirement: the harness starts a
      # local node from this jar and dies without it.
      - name: Download RedPanda JAR (Backend)
        run: |
          mkdir -p references/redPandaj/target
          gh release download latest --repo redPanda-project/redpandaj --pattern 'redpanda.jar' --dir references/redPandaj/target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies + codegen (App)
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # TEMPORARY diagnostic (remove before merge): where does avdmanager on
      # this image actually put the AVD? Run 32981944251 created it with exit 0
      # but $HOME/.android/avd/rp_alice.avd/config.ini did not exist.
      # TEMPORARY diagnostic (remove before merge): run avdmanager exactly the
      # way run.sh does (same PATH), but without the >/dev/null, and show where
      # the AVD lands.
      - name: Probe AVD creation
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          ls "$ANDROID_HOME/cmdline-tools/"
          which avdmanager
          set +e
          echo no | avdmanager create avd -n rp_probe -k "system-images;android-35;google_apis;x86_64"
          echo "create exit=$?"
          set -e
          echo "--- HOME/.android:"; find "$HOME/.android" -maxdepth 3 2>/dev/null || true
          echo "--- HOME/.config:"; find "$HOME/.config" -maxdepth 3 -iname '*android*' -o -maxdepth 3 -iname '*avd*' 2>/dev/null || true
          echo "--- avd config.ini anywhere under HOME:"; find "$HOME" -name 'config.ini' -path '*avd*' 2>/dev/null || true

      - name: Run emulator duo E2E
        env:
          RP_SCENARIOS: ${{ inputs.scenarios || 's1,s2,s3,s4' }}
        run: tool/emu_duo_e2e/run.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: build/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
