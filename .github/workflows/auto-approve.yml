name: Auto Approve Copilot Workflows

on:
  pull_request_target:
    branches: [ main, develop ]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.actor == 'copilot-swe-agent[bot]'
    permissions:
      actions: write
    steps:
      - name: Approve pending workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;

            // Retry loop: poll for runs needing approval (may take a moment to register)
            let approved = 0;
            for (let attempt = 1; attempt <= 6; attempt++) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                status: 'action_required',
              });

              for (const run of runs.data.workflow_runs) {
                try {
                  core.info(`Approving workflow run ${run.id} (${run.name})`);
                  await github.rest.actions.approveWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  approved++;
                  core.info(`Approved workflow run ${run.id}`);
                } catch (error) {
                  core.warning(`Failed to approve run ${run.id}: ${error.message}`);
                }
              }

              if (approved > 0) break;
              core.info(`Attempt ${attempt}/6: no runs need approval yet, retrying in 10s…`);
              await new Promise(r => setTimeout(r, 10000));
            }

            core.info(`Done – approved ${approved} workflow run(s) for SHA ${headSha}`);
