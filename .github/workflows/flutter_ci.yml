name: Flutter CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# CI only checks out code, downloads a release asset, and runs tests —
# nothing is pushed or published, so read access to contents is all it needs.
permissions:
  contents: read

jobs:
  # Cheap guards that need only bash + git (+ gh for the proto fetch), kept out
  # of the Flutter job so they report within seconds and an upstream proto
  # drift does not hide the test results (or vice versa).
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Both workflows pin Flutter; a drift would turn every local pre-push red
      # after merge and let the emulator gate test another toolchain (TD280).
      - name: Flutter pins agree (flutter_ci.yml = emu_duo_e2e.yml)
        run: tool/pre_push_validation.sh --pins-only

      # The repo-mapper map must not point at deleted files (TD277).
      - name: Repo map has no dead paths
        run: tool/check_repo_map.sh

      # Vendored protos must equal redpandaj main (TD097). Deliberate trade-off:
      # a proto change merged on redpandaj turns this red on every mobile PR
      # until `tool/sync_protos.sh && tool/generate_protos.sh` is committed.
      # With --ref the script fails instead of skipping when GitHub is
      # unreachable, so a missing token cannot pass silently.
      - name: Vendored protos in sync with redpandaj main
        run: tool/sync_protos.sh --check --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    # Hard ceiling: a hung E2E node (leaked java subprocess keeping the test
    # runner alive) must never sit on GitHub's 6h default. A healthy full run
    # is ~20-25 min since the MS08 suite (3 clients, 4 nodes) joined; retries
    # on a flaky suite push it toward 30.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # SINGLE SOURCE OF TRUTH for the Flutter/Dart toolchain of this repo.
          # Pinned exactly, not '3.x': the floating range silently moved from
          # 3.47.1 to 3.47.2 on 2026-08-30 and turned every open PR red without a
          # single code change (the 3.47.2 analyzer deprecated the legacy
          # `analyzer: plugins:` mechanism). A floating toolchain also means
          # `dart format` can reformat untouched files between two runs, which no
          # local pre-push validation can predict. Bump this deliberately, in a PR
          # that also carries any resulting repo-wide reformat, and update
          # CLAUDE.md + .claude/skills/pre-push-validation/SKILL.md in the same PR
          # (emu_duo_e2e.yml carries the identical pin).
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies (Light Client)
        run: |
          cd packages/redpanda_light_client
          flutter pub get

      - name: Download RedPanda JAR (Backend)
        continue-on-error: true
        run: |
          mkdir -p references/redPandaj/target
          gh release download latest --repo redPanda-project/redpandaj --pattern 'redpanda.jar' --dir references/redPandaj/target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting (Light Client)
        run: |
          cd packages/redpanda_light_client
          dart format --output=none --set-exit-if-changed .

      - name: Analyze (Light Client)
        run: |
          cd packages/redpanda_light_client
          flutter analyze

      # Fast, parallel: everything except the node-backed E2E suites.
      - name: Run Unit Tests (Light Client)
        timeout-minutes: 8
        run: |
          cd packages/redpanda_light_client
          flutter test --exclude-tags e2e

      # E2E serially (--concurrency=1): each suite spawns 2-4 java nodes, so
      # running several files at once starves the CI runner's 2 cores and the
      # DHT/OH-announce/routing timing slips — that concurrency, not the code,
      # is what made these suites flaky (empty inbox → @Retry → long runs).
      # Serial execution removes the contention and keeps only one node
      # topology (port 59558) alive at a time.
      - name: Run E2E Tests (Light Client)
        timeout-minutes: 30
        run: |
          cd packages/redpanda_light_client
          flutter test --tags e2e --concurrency=1

      - name: Install dependencies (App)
        run: flutter pub get

      - name: Check Formatting (App)
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code (App)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (App)
        run: flutter analyze

      - name: Run Tests (App)
        timeout-minutes: 8
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found, skipping tests."
          fi
